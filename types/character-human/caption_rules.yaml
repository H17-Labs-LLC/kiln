# Caption rules for a character-human LoRA. Inconsistent captions are a data bug that no training setting can
# fix, so these rules are followed exactly. The caption tools read this file (`kiln captions lint` flags a
# broken rule); `kiln types check character-human` validates it against schemas/type-caption-rules.schema.json.

schema: kiln/type-caption-rules/1
type: character-human

# Write all three levels when you can; train on one. Short captions drop what the model needs to separate the
# person from the outfit; long captions teach incidental detail as if it were identity.
levels:
  short:
    words: [8, 20]
    trained: false
    purpose: identity and framing only; shows how much the model leans on the trigger
  medium:
    words: [35, 75]
    trained: true
    purpose: the caption that is trained
  long:
    words: [90, 160]
    trained: false
    purpose: the full description with light and mood, kept for comparisons
train_level: medium

structure: [trigger, class word, varied attributes, camera and framing, setting and light, style tag]
template: "{trigger}, {class_word}, {attributes}, {framing}, {setting}, {style_tag}"

trigger:
  position: first
  keep_tokens: 1
  rule: >-
    The trigger comes first in every caption, and keep_tokens = 1 keeps it there. Verify it with the
    tokenizer before the first caption is written: at most two CLIP-L pieces and an exact round trip.

class_word:
  applies: true
  default: null
  examples: [a woman, a man, an adult]
  rule: >-
    One class word, nothing more, optionally with the age in words: it tells the model what kind of thing
    the trigger is. Everything fixed about the person (face, hair, eyes, skin, special features) stays out of
    the caption, so the trigger alone learns it. Never a real person's name, and never a comparison with one.

style_tag:
  applies: true
  default: realistic digital painting
  rule: one neutral style phrase at the end, the same in every caption; never quality words

default_outfit:
  tag: null
  rule: >-
    The default outfit has one fixed tag: a made-up outfit token plus a plain material word (intake question
    7). Write it exactly so wherever the person wears that outfit and never where they do not. Describe any
    other outfit in plain words. An outfit that is never named gets welded to the trigger, and the LoRA can
    then no longer dress the person differently.

mouth:
  from_intake: mouth
  never_teeth:
    write: closed mouth
    never: [teeth, clenched teeth]
    negative: [teeth]

not_in_captions: []

view_tags:
  enabled: false
  front: null
  front_three_quarter: null
  profile: null
  back: null
  rear_three_quarter: null
  note: realistic families read plain view words (side view, seen from behind) well; booru view tags are off for this type

forbidden:
  quality_words: [masterpiece, best quality, high quality, 8k, 4k, ultra detailed, photorealistic masterpiece]
  source_words: [generated by, ai generated, ai art]
  age_words: [girl, boy, young, petite, teen, teenage, child, kid, little, schoolgirl, school uniform]
  likeness_words: [celebrity, famous, lookalike, look-alike, resembling]

vocabulary: {}

rules:
  - id: only_visible
    text: Caption the picture, not the description. If a feature is hidden in this image, do not mention it.
  - id: no_invented_anatomy
    text: Never describe a limb or back detail the image does not show; that is how a guess becomes canon.
  - id: no_quality_words
    text: Quality words teach nothing and use up caption tokens; the style tag carries the look.
  - id: no_source_words
    text: Never name the tool or model that made an image; the LoRA should learn the person, not the pipeline.
  - id: one_term_per_concept
    text: Pick one word per concept and keep it in every caption; list the wrong words in `vocabulary`.
  - id: no_prompt_leakage
    text: A caption describes the image; a generation prompt describes an intention. Never paste a prompt in as a caption.
  - id: adult_words_only
    text: No word from forbidden.age_words describes the person, in any caption, at any level.
  - id: no_real_people
    text: No caption names, compares with or hints at a real person; no word from forbidden.likeness_words.
  - id: no_commas_inside_phrases
    text: Commas separate clauses; keep each clause one idea, so tools that split on commas keep phrases whole.

dataset_settings:
  shuffle_caption: false
  caption_dropout_rate: 0.0
  why: >-
    Shuffling splits captions on commas and is made for tag lists; it scrambles natural-language phrases.
    With shuffling and caption dropout off, the trainer can also cache the text-encoder outputs, which saves
    memory on an 8 GB card.

example:
  subject: demo_pilot (trigger dmplt, class word "a woman", outfit not the default one)
  caption: >-
    dmplt, a woman in her mid thirties leaning on the railing of a ferry at noon in a grey wool coat, the
    wind tugging at her collar, squinting slightly against the sun, open sea and a distant harbour behind,
    medium shot from the front, realistic digital painting
  why: >-
    trigger, class word with the age, outfit, action, expression, setting, light, framing and style; the
    hair, eyes, skin and earrings are fixed traits and stay out. The coat is described in plain words because
    it is not the default outfit.

later:
  - caption dropout 0.0 against 0.1, as its own run
  - full sentences against a short tag list, as its own run; never mix caption styles inside one dataset
