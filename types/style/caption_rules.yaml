# Caption rules for a style LoRA. In a style LoRA the trigger learns the look, so captions describe only the
# content of each image (what is shown, where, in which light and framing) and never the style itself:
# whatever a caption names is what the trigger does NOT have to learn. The caption tools read this file;
# `kiln types check style` validates it against schemas/type-caption-rules.schema.json.

schema: kiln/type-caption-rules/1
type: style

levels:
  short:
    words: [8, 20]
    trained: false
    purpose: the main subject and framing only
  medium:
    words: [35, 75]
    trained: true
    purpose: the caption that is trained
  long:
    words: [90, 160]
    trained: false
    purpose: the full content description, kept for comparisons
train_level: medium

structure: [trigger, subject and content, setting and light, camera and framing]
template: "{trigger}, {content}, {setting}, {framing}"

trigger:
  position: first
  keep_tokens: 1
  rule: >-
    The trigger comes first in every caption, and keep_tokens = 1 keeps it there; it stands for the whole
    look. Verify it with the tokenizer before the first caption is written: at most two CLIP-L pieces and an
    exact round trip.

class_word:
  applies: false
  default: null
  rule: a style has no class word; the content of each image is described in plain words instead

style_tag:
  applies: false
  default: null
  rule: >-
    Never describe the style in a caption: no medium, technique, palette or finish words. The trigger alone
    learns the look; a style word in the caption would take that job away from it.

not_in_captions: []

view_tags:
  enabled: false
  front: null
  front_three_quarter: null
  profile: null
  back: null
  rear_three_quarter: null
  note: framing and viewpoint are written in plain words as part of the content

forbidden:
  quality_words: [masterpiece, best quality, high quality, 8k, 4k, ultra detailed, absurdres]
  source_words: [generated by, ai generated, ai art]
  age_words: [girl, boy, young, petite, teen, teenage, child, kid, little, schoolgirl, school uniform]
  style_words: [illustration, anime style, cel shading, flat colours, flat colour, outlines, watercolour, oil painting, poster style, digital art]

vocabulary: {}

rules:
  - id: content_only
    text: Describe what the image shows, never how it is rendered; no word from forbidden.style_words.
  - id: only_visible
    text: Caption what is in the picture; never invent objects or details that are not there.
  - id: people_are_adults
    text: Any person in an image is described as an adult (a woman, a man, an adult); no word from forbidden.age_words.
  - id: no_artist_names
    text: Never name an artist, a studio or a franchise; the trigger is the only name the style has.
  - id: no_quality_words
    text: Quality words teach nothing and use up caption tokens.
  - id: no_source_words
    text: Never name the tool or model that made an image.
  - id: one_term_per_concept
    text: Pick one word per concept and keep it in every caption; list the wrong words in `vocabulary`.
  - id: no_prompt_leakage
    text: A caption describes the image; a generation prompt describes an intention. Never paste a prompt in as a caption.

dataset_settings:
  shuffle_caption: false
  caption_dropout_rate: 0.0
  why: >-
    Shuffling splits captions on commas and is made for tag lists; it scrambles natural-language phrases.
    With shuffling and caption dropout off, the trainer can also cache the text-encoder outputs, which saves
    memory on an 8 GB card.

example:
  subject: demo_style (trigger dmstl)
  caption: >-
    dmstl, a lighthouse on a rocky point at sunset with a small fishing boat passing in front of it, gulls
    overhead, long shadows across the rocks, calm sea in the foreground and low clouds along the horizon,
    wide view from the water
  why: >-
    trigger, then content, setting, light and framing; not one word about outlines, shading, palette or
    grain, because those are the style the trigger learns.

later:
  - caption dropout 0.0 against 0.1, as its own run
  - content captions against trigger-only captions, as its own run; never mix caption styles inside one dataset
