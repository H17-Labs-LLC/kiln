# Caption rules for a character-anime LoRA. Inconsistent captions are a data bug that no training setting can
# fix, so these rules are followed exactly. The caption tools read this file (`kiln captions lint` flags a
# broken rule); `kiln types check character-anime` validates it against schemas/type-caption-rules.schema.json.

schema: kiln/type-caption-rules/1
type: character-anime

# Write all three levels when you can; train on one. Short captions drop what the model needs to separate the
# subject from the outfit; long captions teach incidental detail as if it were identity.
levels:
  short:
    words: [8, 20]
    trained: false
    purpose: identity and framing only; shows how much the model leans on the trigger
  medium:
    words: [35, 75]
    trained: true
    purpose: the caption that is trained
  long:
    words: [90, 160]
    trained: false
    purpose: the full description with light and mood, kept for comparisons
train_level: medium

structure: [trigger, class word, varied attributes, camera and framing, setting and light, style tag]
template: "{trigger}, {class_word}, {attributes}, {framing}, {setting}, {style_tag}"

trigger:
  position: first
  keep_tokens: 1
  rule: >-
    The trigger comes first in every caption, and keep_tokens = 1 keeps it there. Verify it with the
    tokenizer before the first caption is written: at most two CLIP-L pieces and an exact round trip.

class_word:
  applies: true
  default: null
  examples: [a woman, a man, an adult, a robot]
  rule: >-
    One class word, nothing more: it tells the model what kind of thing the trigger is. Everything fixed
    about the subject (face, colours, build, special features) stays out of the caption, so the trigger
    alone learns it. The class word is always an adult noun and never a proper name: a name the base
    model already knows pulls every image toward what it learnt for that name.

style_tag:
  applies: true
  default: anime illustration
  rule: one neutral style phrase at the end, the same in every caption; never quality words

default_outfit:
  tag: null
  rule: >-
    The default outfit has one fixed tag: a made-up outfit token plus a booru material tag (intake question
    7). Write it exactly so wherever the subject wears that outfit and never where it does not. Describe any
    other outfit in plain words. An outfit that is never named gets welded to the trigger, and the LoRA can
    then no longer dress the subject differently.

mouth:
  from_intake: mouth
  never_teeth:
    write: closed mouth
    never: [teeth, clenched teeth, fangs]
    negative: [teeth, fangs]

not_in_captions: []

view_tags:
  enabled: true
  front: straight-on
  front_three_quarter: null
  profile: profile, from side
  back: from behind
  rear_three_quarter: null
  note: booru view tags that SDXL-based anime families know, written next to the plain view words; three-quarter views keep their plain words

forbidden:
  quality_words: [masterpiece, best quality, high quality, 8k, 4k, ultra detailed, absurdres]
  source_words: [generated by, ai generated, ai art]
  age_words: [girl, boy, young, petite, teen, teenage, child, kid, little, schoolgirl, school uniform]

vocabulary: {}

rules:
  - id: only_visible
    text: Caption the picture, not the character sheet. If a feature is hidden in this image, do not mention it.
  - id: no_invented_anatomy
    text: Never describe a limb, joint or back detail the image does not show; that is how a guess becomes canon.
  - id: no_quality_words
    text: Quality words teach nothing and use up caption tokens; the style tag carries the look.
  - id: no_source_words
    text: Never name the tool or model that made an image; the LoRA should learn the subject, not the pipeline.
  - id: one_term_per_concept
    text: Pick one word per concept and keep it in every caption; list the wrong words in `vocabulary`.
  - id: no_prompt_leakage
    text: A caption describes the image; a generation prompt describes an intention. Never paste a prompt in as a caption.
  - id: adult_words_only
    text: No word from forbidden.age_words describes the subject, in any caption, at any level.
  - id: no_commas_inside_phrases
    text: Commas separate clauses; keep each clause one idea, so tools that split on commas keep phrases whole.

dataset_settings:
  shuffle_caption: false
  caption_dropout_rate: 0.0
  why: >-
    Shuffling splits captions on commas and is made for tag lists; it scrambles natural-language phrases.
    With shuffling and caption dropout off, the trainer can also cache the text-encoder outputs, which saves
    memory on an 8 GB card.

example:
  subject: demo_robot (trigger dmrbt, class word "a robot", outfit not the default one)
  caption: >-
    dmrbt, a robot standing on a quiet train platform at dusk in a long grey raincoat, one hand raised in a
    small wave, head tilted slightly to the side, warm station lamps and a soft blue evening sky behind,
    full-body three-quarter view from the left, clean anime illustration with flat colours
  why: >-
    trigger, class word, outfit, action, setting, light, framing and style, and nothing invented. The
    raincoat is described in plain words because it is not the default outfit; in the default outfit the
    caption names the outfit tag instead.

later:
  - caption dropout 0.0 against 0.1, as its own run
  - full sentences against a short tag list, as its own run; never mix caption styles inside one dataset
