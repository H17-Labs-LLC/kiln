# The kiln demo instance: one synthetic project, demo_robot (trigger dmrbt), with 2030 dates and ids.
# Its media are not committed: `python tests/fixtures/make_fixtures.py --place <a copy of this folder> --demo kiln`
# generates them (the test fixture demo_workspace does this for every test).
schema = "kiln/config/1"

[instance]
name = "demo"
adopted = false

[paths]
root = "."
models_root = "models"
projects = "projects"
journal = "journal"
runtime = "runtime"
images_root = "dataset-images"   # the read-only folder that root: images files live in

[comfyui]
url = "http://127.0.0.1:8188"
dir = ""
python = ""
min_version = "0.43.0"
manage_lifecycle = false

[limits]
host_ram_floor_gb = 2.0
disk_floor_gb = 20               # a neutral default; set what your models and runs need
max_concurrent_gpu_jobs = 1

[scheduler]
kind = "none"
fail_open = false

[jobs]
allowed = []

[review]
bind = "127.0.0.1"
port = 8741

[policy]
reviewer = "human-only"
prompt_authoring = "sfw-only"
unknown_rating_is = "nsfw"
second_source_name = "assistant"
render = "native"
subjects = "fictional-adults-only"

[privacy]
wordlist = ""
headless = true

[train]
venv_dir = "runtime/venv-train"
python = ""
sd_scripts = "runtime/sd-scripts"
max_vram_fraction = 0.9

[sources]
codex_home = ""
comfy_url = ""
easel_home = ""

[legacy]

[env_aliases]
