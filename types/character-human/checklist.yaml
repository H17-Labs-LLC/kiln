# Checklist skeleton for a character-human LoRA: the hard rules every training image is judged by.
#
# Each item is stated in every generation prompt AND judged pass or fail per image in review. Fill the items
# from intake question 3 (an assistant drafts them, the person approves); `example` shows each item filled in
# for the synthetic invented subject (demo_pilot). The `body` item is required and always describes adult
# geometry. Checked by `kiln types check character-human` against schemas/type-checklist.schema.json.

schema: kiln/type-checklist/1
type: character-human
kind: identity
guidance:
  - Keep 6-10 items, each one checkable by eye on a single image.
  - State positive geometry first and at most one short "not" clause last; repeating a forbidden feature primes it.
  - skip_when names the viewpoints and framings where the item cannot be seen; there it is left out of the prompt and is n/a in review.
  - Use the person's own words once they exist.
  - Fixed traits named here stay out of every caption (caption_rules.yaml not_in_captions), so the trigger alone learns them.
  - Describe the invented face by its own geometry, never by comparison with a real person.
  - Change the text only with a new spec version and a decision record; images made under different text are never compared blind.
vocabulary:
  viewpoints: [front, front_three_quarter, profile, back, rear_three_quarter, unusual]
  framings: [close, medium, full, wide]
items:
  - key: face
    heading: "FACE: <SHORT RULE>"
    text: The face shape and proportions as geometry. One short "not" clause last.
    skip_when: {viewpoint: [back]}
    review: {label: Face, hint: "the face matches the references from this angle"}
    example: "FACE: an oval adult face, defined cheekbones, a straight nose, a firm jaw; not round."
  - key: hair
    heading: "HAIR: <SHORT RULE>"
    text: Hair length, cut, colour and how it falls.
    review: {label: Hair, hint: "length, cut and colour as stated"}
    example: "HAIR: short copper-red hair swept straight back, ending above the collar."
  - key: eyes
    heading: "EYES: <SHORT RULE>"
    text: Eye colour and shape.
    skip_when: {viewpoint: [back]}
    review: {label: Eyes, hint: "colour and shape as stated"}
    example: "EYES: grey-green eyes, level and slightly narrow."
  - key: skin
    heading: "SKIN: <SHORT RULE>"
    text: Skin tone and any fixed marks such as freckles.
    review: {label: Skin, hint: "tone and marks as stated"}
    example: "SKIN: light skin with fine freckles across the nose and cheeks."
  - key: body
    heading: "BODY: ADULT <SHORT RULE>"
    text: >-
      The build as an adult: height in heads and the relations between widths, for example shoulders
      against head and hips. Never words that read young.
    skip_when: {framing: [close]}
    review: {label: Body, hint: "reads as an adult; proportions as stated"}
    example: "BODY: adult build, about seven and a half heads tall, shoulders clearly wider than the head."
  - key: feature
    heading: "FEATURE: <SHORT RULE>"
    text: The one special feature that makes the person recognisable, where it sits and how big it is.
    review: {label: Feature, hint: "present, right size, right place"}
    example: "EARRINGS: a small plain silver ring in each earlobe."
review_only:
  - key: outfit
    label: Outfit
    hint: matches the OUTFIT block of the spec, back coverage included
    skip_when: {framing: [close]}
  - key: render
    label: Clean render
    hint: no artefacts, extra limbs, text or sheet layout
  - key: no_real_likeness
    label: Invented face
    hint: the image does not look like a specific real person; if it does, reject it
  - key: mouth
    label: Mouth
    hint: no teeth visible
    when: mouth = never_teeth
