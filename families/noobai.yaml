# Model family `noobai` (NoobAI XL). Public model-family facts only.
# Shared keys (every top-level key except `schema`, `inference` and `training`) are identical in
# the easel and kiln copies of this file; `tools/sync_common.py --check` compares them.
# `inherits`: a block this file leaves out is read from the parent family (the child's keys win).
# `basis` says where a number comes from: measured on the reference machine, or a prior.
# `training`: kiln's training recipe for this family (8 GB reference machine).

schema: kiln/family/1
id: noobai
name: NoobAI XL
status: unverified
inherits: illustrious
architecture:
  kind: unet-sdxl
  latent_channels: 4
  text_encoders: [clip-l, clip-g]
  native_resolution: 1024
description: Illustrious derivative (v-pred / eps variants exist — check per file).
licence_summary:
  status: unverified
  name: null
  text: 'unverified: read the model card'
  url: https://huggingface.co/Laxhar/noobai-XL-1.0
# host_ram_gb: eval includes the ComfyUI server (the eval step waits for this much free RAM, then starts it).
host_ram_gb:
  train: 5.5
  eval: 8.5
  eval_includes_comfyui_server: true
  basis: inherited from the sdxl recipe; not measured on this family
training:
  supported: true
  basis: the inherited sdxl recipe; not trained on the reference machine (unverified)
